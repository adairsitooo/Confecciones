<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Atelier JASY</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- =========================
         ENCABEZADO
    ========================== -->

    <header class="header">

        <div class="header-contenido">

            <h1>Atelier JASY</h1>

            <p>
                Sistema de cotizaciones
            </p>

        </div>

    </header>


    <main class="contenedor">


        <!-- =========================
             INFORMACIÓN DEL CLIENTE
        ========================== -->

        <section class="card">

            <h2>
                Información del cliente
            </h2>


            <div class="form-grid">

                <div class="campo">

                    <label for="cliente">
                        Nombre del cliente
                    </label>

                    <input
                        type="text"
                        id="cliente"
                        placeholder="Ej. María López"
                    >

                </div>


                <div class="campo">

                    <label for="numeroCliente">
                        Número de celular
                    </label>

                    <input
                        type="tel"
                        id="numeroCliente"
                        placeholder="Ej. 4185-8879"
                    >

                </div>

            </div>

        </section>



        <!-- =========================
             DESCRIPCIÓN DEL PEDIDO
        ========================== -->

        <section class="card">

            <h2>
                Descripción del pedido
            </h2>


            <div class="campo">

                <label for="vestido">
                    Descripción
                </label>

                <textarea
                    id="vestido"
                    rows="5"
                    placeholder="Describa detalladamente el vestido o pedido..."
                ></textarea>

            </div>


            <div class="form-grid">

                <div class="campo">

                    <label for="cantidad">
                        Cantidad
                    </label>

                    <input
                        type="number"
                        id="cantidad"
                        min="1"
                        value="1"
                    >

                </div>

            </div>

        </section>



        <!-- =========================
             MONTOS
        ========================== -->

        <section class="card">

            <h2>
                Montos
            </h2>


            <div class="form-grid">

                <div class="campo">

                    <label for="precio">
                        Precio unitario
                    </label>

                    <input
                        type="number"
                        id="precio"
                        min="0"
                        step="0.01"
                        placeholder="Q0.00"
                    >

                </div>


                <div class="campo">

                    <label for="abonado">
                        Abonado
                    </label>

                    <input
                        type="number"
                        id="abonado"
                        min="0"
                        step="0.01"
                        value="0"
                        placeholder="Q0.00"
                    >

                </div>


                <div class="campo">

                    <label for="anticipo">
                        Anticipo requerido (%)
                    </label>

                    <input
                        type="number"
                        id="anticipo"
                        min="0"
                        max="100"
                        value="50"
                    >

                </div>

            </div>


            <div class="resumen">

                <div class="resumen-fila">

                    <span>
                        Precio unitario
                    </span>

                    <strong id="precioResumen">
                        Q0.00
                    </strong>

                </div>


                <div class="resumen-fila">

                    <span>
                        Cantidad
                    </span>

                    <strong id="cantidadResumen">
                        1
                    </strong>

                </div>


                <div class="resumen-fila">

                    <span>
                        Subtotal
                    </span>

                    <strong id="subtotal">
                        Q0.00
                    </strong>

                </div>


                <div class="resumen-fila">

                    <span>
                        Anticipo requerido
                    </span>

                    <strong id="anticipoMonto">
                        Q0.00
                    </strong>

                </div>


                <div class="resumen-fila">

                    <span>
                        Abonado
                    </span>

                    <strong id="abonadoMonto">
                        Q0.00
                    </strong>

                </div>


                <div class="resumen-fila">

                    <span>
                        Pendiente de anticipo
                    </span>

                    <strong id="pendienteAnticipo">
                        Q0.00
                    </strong>

                </div>


                <div class="resumen-fila total">

                    <span>
                        Saldo restante
                    </span>

                    <strong id="saldo">
                        Q0.00
                    </strong>

                </div>

            </div>

        </section>



        <!-- =========================
             FECHAS
        ========================== -->

        <section class="card">

            <h2>
                Fechas
            </h2>


            <div class="form-grid">

                <div class="campo">

                    <label for="fechaTalle">
                        Fecha de talle
                    </label>

                    <input
                        type="date"
                        id="fechaTalle"
                    >

                </div>


                <div class="campo">

                    <label for="fechaEntrega">
                        Fecha de entrega final
                    </label>

                    <input
                        type="date"
                        id="fechaEntrega"
                    >

                </div>

            </div>

        </section>



        <!-- =========================
             IMÁGENES
        ========================== -->

        <section class="card">

            <h2>
                Imágenes de referencia
            </h2>


            <div class="campo">

                <label for="imagenes">
                    Puede agregar hasta 5 imágenes
                </label>

                <input
                    type="file"
                    id="imagenes"
                    accept="image/*"
                    multiple
                >

                <div
                    id="previewImagenes"
                    class="preview-imagenes"
                ></div>

            </div>

        </section>



        <!-- =========================
             BOTONES
        ========================== -->

        <section class="acciones">

            <button
                type="button"
                id="generarBtn"
                class="btn btn-principal"
            >
                Generar cotización PDF
            </button>


            <button
                type="button"
                id="limpiarBtn"
                class="btn btn-secundario"
            >
                Limpiar
            </button>

        </section>


    </main>


    <!-- =========================
         jsPDF
    ========================== -->

    <script src="https://unpkg.com/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>


    <script src="script.js"></script>

</body>

</html>
